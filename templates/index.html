<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Archirecture</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='CSS/main/1.css')}}">
        <link rel="icon" href="{{ url_for('static', filename='img/main-icons/32x32/Vector.svg') }}" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Abril+Fatface&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <header class="header">
            <div class="header-top">
                <a href="index.html" class="logo-link">
                    <img src="/static/img/header/Vector.svg" alt="АРХИТЕКТУРНЫЙ БЛОГ" class="logo">
                </a>
            </div>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#">Современные здания</a></li>
                    <li class="nav-item"><a href="#">Старинные здания</a></li>
                    <li class="nav-item"><a href="#">Последние проекты</a></li>
                    <li class="nav-item"><a href="#">Архитектурные новости</a></li>
                </ul>
            </nav>
        </header>
        <main>
            
            {% block body %} {% endblock %}

             <table>
                <!-- Заголовок таблицы -->
                <thead>
                    <tr>
                        <th>Заголовок 1</th> <!-- Table Header - заголовок столбца -->
                        <th>Заголовок 2</th>
                        <th>Заголовок 3</th>
                    </tr>
                </thead>
                
                <!-- Тело таблицы -->
                <tbody>
                    <tr>
                        <td>Данные 1</td>
                        <td>Данные 2</td>
                        <td>Данные 3</td>
                    </tr>

                    <tr>
                        <td>Данные 1</td>
                        <td>Данные 2</td>
                        <td>Данные 3</td>
                    </tr>
                </tbody>
                
                <!-- Подвал таблицы (опционально) -->
                <tfoot>
                    <tr>
                        <td>Итого:</td>
                        <td>100</td>
                        <td>200</td>
                    </tr>
                </tfoot>
            </table>





        </main>
        <footer class="footer">
            <div class="footer-container">
                <div class="social-links">
                    <a href="#" class="social-link facebook"></a>
                    <a href="#" class="social-link twitter"></a>
                    <a href="#" class="social-link instagram"></a>
                    <a href="#" class="social-link pinterest"></a>
                    <a href="#" class="social-link google"></a>
                    <a href="#" class="social-link spotify"></a>
                    <a href="#" class="social-link telegram"></a>
                </div>
            </div>
        </footer>
    </body>
</html>
