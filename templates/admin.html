<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Archirecture</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='CSS/main/1.css')}}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Abril+Fatface&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <header class="header">
            <div class="header-top">
                <a href="index.html" class="logo-link">
                    <img src="/static/img/admin/adminLogo.svg" alt="АРХИТЕКТУРНЫЙ БЛОГ" class="logo">
                </a>
            </div>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#">Современные здания</a></li>
                    <li class="nav-item"><a href="#">Старинные здания</a></li>
                    <li class="nav-item"><a href="#">Последние проекты</a></li>
                    <li class="nav-item"><a href="#">Архитектурные новости</a></li>
                </ul>
            </nav>
        </header>
        <main>
            
            <div class="complited-emails container-width">
                <div class="main-buildings-name admin-titles">Собранные почты</div>

                <table>
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Email</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>

                    <tbody>
                    {% for el in articles %} 
                        <tr>
                            <td class="id">{{ el.id }}</td>
                            <td class="email">{{ el.email }}</td>
                            <td class="date.date">{{ el.date }}</td>
                            <td class="status">Статус</td>
                            <td class="details">
                                <a href="/admin/{{ el.id }}" class="details-button">Детали</a>
                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>

           
        </main>
        <footer class="footer">
            <div class="footer-container">
                <div class="social-links">
                    <a href="#" class="social-link facebook"></a>
                    <a href="#" class="social-link twitter"></a>
                    <a href="#" class="social-link instagram"></a>
                    <a href="#" class="social-link pinterest"></a>
                    <a href="#" class="social-link google"></a>
                    <a href="#" class="social-link spotify"></a>
                    <a href="#" class="social-link telegram"></a>
                </div>
            </div>
        </footer>
    </body>
</html>
